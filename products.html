  <style>
    :root {
      --paper: #F6F3EC;
      --ink: #23241F;
      --gold: #C1873D;
      --card: rgba(255, 255, 255, 0.44);
      --border: #E2DDCF;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }
    main {
      width: min(92vw, 620px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2rem 1.5rem;
      box-shadow: 0 14px 40px rgba(35, 36, 31, 0.04);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(1.8rem, 3vw, 2.6rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }
    p {
      margin: 0;
      font-size: 1rem;
    }
    a {
      color: var(--ink);
      text-decoration: underline;
      text-underline-offset: 0.15em;
      text-decoration-color: var(--gold);
    }
  </style>
</head>
